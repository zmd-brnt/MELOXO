name: meloxo

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: meloxo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: meloxo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meloxo -d meloxo"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
